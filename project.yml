name: Sekine
options:
  bundleIdPrefix: com.sekineapp
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: "33L468BTR2"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.4.0"

targets:
  Sekine:
    type: application
    platform: iOS
    sources:
      - path: Sekine
    dependencies:
      - package: Adhan
        product: Adhan
      - target: SekineWidget
      - target: SekineWatch
        embed: true
        platformFilter: iOS
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekineapp.sekine
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Cinar
        INFOPLIST_KEY_CFBundleDisplayName: Sekine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Namaz vakitlerini bulunduğunuz konuma göre Diyanet'e uygun hesaplamak için konumunuz kullanılır. Konum cihazınızdan dışarı gönderilmez."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Namaz vakitlerini konumunuza göre hesaplamak için konum izni kullanılır. Konum cihazınızdan dışarı gönderilmez."
        CODE_SIGN_ENTITLEMENTS: Sekine/Sekine.entitlements
    info:
      path: Sekine/Info.plist
      properties:
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.sekineapp.sekine.refresh
          - com.sekineapp.sekine.nightly
        CFBundleLocalizations:
          - tr
          - en
        CFBundleDevelopmentRegion: tr

  SekineWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SekineWidget
      - path: Sekine/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekineapp.sekine.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SekineWidget/SekineWidget.entitlements
    info:
      path: SekineWidget/Info.plist
      properties:
        CFBundleDisplayName: Sekine
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SekineWatch:
    type: application
    platform: watchOS
    sources:
      - path: SekineWatch
      - path: Sekine/Shared
      - path: Sekine/Core/PrayerTimes
      - path: Sekine/Core/Location
      - path: Sekine/Core/Notifications
      - path: Sekine/Core/Premium
      - path: Sekine/Core/Storage
      - path: Sekine/Features/Qibla/QiblaManager.swift
    dependencies:
      - package: Adhan
        product: Adhan
      - target: SekineWatchComplications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekineapp.sekine.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        CODE_SIGN_ENTITLEMENTS: SekineWatch/SekineWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SekineWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sekineapp.sekine
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: "Namaz vakitlerini bulunduğunuz konuma göre hesaplamak için konumunuz kullanılır. Konum cihazınızdan dışarı gönderilmez."
        CFBundleLocalizations:
          - tr
          - en
        CFBundleDevelopmentRegion: tr

  SekineWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: SekineWatchComplications
      - path: Sekine/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekineapp.sekine.watchkitapp.complications
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        CODE_SIGN_ENTITLEMENTS: SekineWatchComplications/SekineWatchComplications.entitlements
    info:
      path: SekineWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: Sekine
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SekineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SekineTests
    dependencies:
      - target: Sekine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekineapp.sekine.tests
        GENERATE_INFOPLIST_FILE: YES
