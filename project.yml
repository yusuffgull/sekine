name: Sekine
options:
  bundleIdPrefix: com.sekineapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: "33L468BTR2"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.4.0"

targets:
  Sekine:
    type: application
    platform: iOS
    sources:
      - path: Sekine
    dependencies:
      - package: Adhan
        product: Adhan
      - target: SekineWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekineapp.sekine
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Sekine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Namaz vakitlerini bulunduğunuz konuma göre Diyanet'e uygun hesaplamak için konumunuz kullanılır. Konum cihazınızdan dışarı gönderilmez."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Namaz vakitlerini konumunuza göre hesaplamak için konum izni kullanılır. Konum cihazınızdan dışarı gönderilmez."
        CODE_SIGN_ENTITLEMENTS: Sekine/Sekine.entitlements
    info:
      path: Sekine/Info.plist
      properties:
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.sekineapp.sekine.refresh
        CFBundleLocalizations:
          - tr
          - en
        CFBundleDevelopmentRegion: tr

  SekineWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SekineWidget
      - path: Sekine/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekineapp.sekine.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SekineWidget/SekineWidget.entitlements
    info:
      path: SekineWidget/Info.plist
      properties:
        CFBundleDisplayName: Sekine
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SekineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SekineTests
    dependencies:
      - target: Sekine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekineapp.sekine.tests
        GENERATE_INFOPLIST_FILE: YES
