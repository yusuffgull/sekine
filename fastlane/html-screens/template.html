<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 1100px 900px at 50% 62%, rgba(255,255,255,0.10), rgba(255,255,255,0) 60%),
      linear-gradient(160deg, #2E9C82 0%, #1F6E5C 42%, #0E2E27 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, "SF Pro Display", sans-serif;
  }
  .header {
    height: 560px;
    width: 100%;
    padding-top: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .kicker {
    color: rgba(255,255,255,0.68);
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 10px;
  }
  .headline {
    margin-top: 26px;
    padding: 0 90px;
    color: #FFFFFF;
    font-size: 92px;
    font-weight: 800;
    text-align: center;
    line-height: 1.16;
    letter-spacing: -1px;
  }
  .device-wrap {
    position: relative;
    filter: drop-shadow(0 60px 90px rgba(0,0,0,0.42)) drop-shadow(0 14px 30px rgba(0,0,0,0.30));
  }
  .device {
    width: 1021px;
    height: 2218px;
    border-radius: 92px;
    border: 3px solid rgba(255,255,255,0.35);
    overflow: hidden;
    position: relative;
    background: #000;
  }
  .device img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="kicker">SEKİNE</div>
    <div class="headline">__HEADLINE__</div>
  </div>
  <div class="device-wrap">
    <div class="device">
      <img src="__IMAGE__">
    </div>
  </div>
</body>
</html>
